name: Validate and package
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm run check
      - run: npm test
      - run: npm run pack:libraries
      - run: npm run build:pages
      - uses: actions/upload-artifact@v4
        with:
          name: chromaforge-${{ github.sha }}
          path: |
            dist/ChromaForge-Standalone.html
            dist/site
            dist/libraries
            dist/packages
          if-no-files-found: error
