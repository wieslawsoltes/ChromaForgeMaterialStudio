<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChromaForge · Standalone renderer example</title><style>html,body{height:100%;margin:0;font:13px system-ui;background:#202126;color:#dedfe4}main{height:100%;display:grid;grid-template-columns:1fr 270px}canvas{width:100%;height:100%;display:block;touch-action:none}aside{border-left:1px solid #42454e;padding:25px}h1{font-size:19px;letter-spacing:-.7px}p{color:#9ea4b0;line-height:1.8}label{display:block;margin:24px 0 8px;color:#b8bdc7}select,button{width:100%;padding:10px;background:#30333b;color:inherit;border:1px solid #4f5561;border-radius:5px}button{margin-top:16px;cursor:pointer}code{font-size:11px;color:#d2ae78}a{color:#d2ae78}#status{font-size:11px;color:#b4c09c}@media(max-width:700px){main{grid-template-columns:1fr 200px}aside{padding:15px}}</style></head><body><main><canvas id="view" aria-label="Interactive material renderer"></canvas><aside><h1>ChromaForge SDK</h1><p>An independent viewport using only the Geometry, Paint, Core and Renderer modules. No studio UI is required.</p><label for="model">Mesh</label><select id="model"><option value="sphere">Sphere</option><option value="torus">Torus</option><option value="cube">Rounded cube</option></select><label for="material">Material</label><select id="material"></select><button id="frame">Frame model</button><button id="wire">Toggle wireframe</button><p id="status">Preparing renderer…</p><p>Drag to orbit. Scroll to zoom.<br><br><code>new MaterialRenderer(canvas)</code><br><code>renderer.setMesh(mesh)</code><br><code>renderer.upload(0, maps, 1)</code><br><code>renderer.draw()</code></p></aside></main><script type="module" src="./renderer.js"></script></body></html>
